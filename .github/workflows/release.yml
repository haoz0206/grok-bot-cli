name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer main push cancels a queued, waiting, or in-progress run in this
  # group. Cancellation is not instant and does not roll back npm. The
  # publish job also refuses to publish unless this SHA is still the remote
  # main tip immediately before npm publish.
  group: changesets-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-only:
    if: github.repository == 'haoz0206/grok-bot-cli' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Reject a manual run that is not main
        run: |
          echo "::error::Release workflow_dispatch is limited to refs/heads/main."
          exit 1

  platform:
    if: github.repository == 'haoz0206/grok-bot-cli' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"

      - name: Install dependencies
        run: npm ci

      - name: Build current sources
        run: npm run build

      - name: Exercise credential boundaries and doctor
        run: npm run test:platform

      - name: Typecheck and validate generated artifact
        run: |
          npm run typecheck
          npm run validate:artifact

      - name: Pack and smoke-test all executable entries
        shell: bash
        run: |
          set -eu
          package_root=$(mktemp -d)
          install_root=$(mktemp -d)
          npm pack --pack-destination "$package_root"
          package_files=("$package_root"/*.tgz)
          test -f "${package_files[0]}"
          test "${#package_files[@]}" -eq 1
          npm install --prefix "$install_root" "${package_files[0]}"
          npm exec --prefix "$install_root" --no -- gbot --version
          npm exec --prefix "$install_root" --no -- gbot --help
          npm exec --prefix "$install_root" --no -- grok-bot --help
          npm exec --prefix "$install_root" --no -- gbot-install --help

  version:
    if: github.repository == 'haoz0206/grok-bot-cli' && github.ref == 'refs/heads/main'
    needs: platform
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: none
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect pending changesets
        id: pending
        shell: bash
        run: |
          set -eu
          pending=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)
          if [ -n "$pending" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "pending changeset: $pending"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "no pending changesets"
          fi

      - name: Set up Node.js
        if: steps.pending.outputs.pending == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"

      - name: Install dependencies
        if: steps.pending.outputs.pending == 'true'
        run: npm ci

      - name: Validate, build, typecheck, and test
        if: steps.pending.outputs.pending == 'true'
        run: npm run check

      - name: Open or update the release pull request
        if: steps.pending.outputs.pending == 'true'
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-base-branch: main
          commit-message: Release packages
          create-github-releases: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: Release packages
          push-git-tags: false
          push-with-git-cli: true
          version-script: npm run release:version

  release-candidate:
    if: github.repository == 'haoz0206/grok-bot-cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: none
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the commit before npm-publish
        id: gate
        env:
          PUBLISH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 .github/release/check_release_candidate_gate.py

  publish:
    if: github.repository == 'haoz0206/grok-bot-cli' && github.ref == 'refs/heads/main' && needs.release-candidate.outputs.decision == 'publish'
    needs: [platform, version, release-candidate]
    runs-on: ubuntu-26.04
    environment: npm-publish
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require protected npm-publish environment
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_PUBLISH_REPOSITORY: ${{ github.repository }}
        run: python3 .github/release/check_npm_publish_environment.py

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Validate, build, typecheck, and test
        run: npm run check

      - name: Lint the package
        run: npx --yes publint@0.3.24

      - name: Pack and smoke-test the executable
        shell: bash
        run: |
          package_root=$(mktemp -d)
          install_root=$(mktemp -d)
          npm pack --pack-destination "$package_root"
          package_files=("$package_root"/*.tgz)
          test -f "${package_files[0]}"
          test "${#package_files[@]}" -eq 1
          npm install --prefix "$install_root" "${package_files[0]}"
          npm exec --prefix "$install_root" --no -- gbot --help
          npm exec --prefix "$install_root" --no -- grok-bot --help
          npm exec --prefix "$install_root" --no -- gbot-install --help

      - name: Require this attempt to publish the validated main tip
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_PUBLISH_REPOSITORY: ${{ github.repository }}
          PUBLISH_GITHUB_SHA: ${{ github.sha }}
          PUBLISH_GITHUB_REF: ${{ github.ref }}
          PUBLISH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 .github/release/check_publish_commit.py

      - name: Publish released packages
        id: changesets
        env:
          NPM_CONFIG_LOGS_DIR: ${{ runner.temp }}/gbot-publish-logs
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-base-branch: main
          commit-message: Release packages
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: npm run release
          pr-title: Release packages
          push-with-git-cli: true
          version-script: node -e "console.error('publish job refuses to version while changesets remain'); process.exit(1)"

      - name: Stop when changesets are still present
        if: steps.changesets.outputs.has-changesets != 'false'
        run: |
          echo "::error::The publish job saw pending changesets and did not publish."
          exit 1

      - name: Verify package.json version resolves on npm
        if: steps.changesets.outputs.has-changesets == 'false'
        shell: bash
        run: |
          set -eu
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # npm can take several minutes to show a just-published version.
          # Retry for ~20 minutes (40 × 30s) before failing.
          for attempt in $(seq 1 40); do
            if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "registry $name@$version"
              exit 0
            fi
            echo "attempt $attempt: $name@$version not on npm yet"
            sleep 30
          done
          echo "::error::$name@$version is not on npm; the release did not publish."
          exit 1

      - name: Report npm publish result on failure
        if: failure()
        shell: bash
        run: |
          # Changesets captures npm output, including errors from a false success.
          # Show only command/status records; exclude config and authentication data.
          grep -hE ' (verbose (title|exit)|info using|http fetch PUT|error|warn|notice Publishing) ' \
            "$RUNNER_TEMP"/gbot-publish-logs/* 2>/dev/null || true
